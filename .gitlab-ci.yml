# chi-core has path dependencies on sibling checkouts, so CI recreates the
# workspace layout next to the project directory before building.
#
# tree-sitter-chi is a private project, cloned here with the job token.
# For that clone to be authorized, tree-sitter-chi must allow this project
# in Settings → CI/CD → Job token permissions.

stages:
  - test
  - deploy

test:
  stage: test
  image: rust:latest
  variables:
    CARGO_HOME: $CI_PROJECT_DIR/.cargo
  cache:
    key: cargo
    paths:
      - .cargo
      - target
  before_script:
    - rm -rf ../tree-sitter-chi ../curve-fit
    - git clone --depth 1 "https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/chi-lang/tree-sitter-chi.git" ../tree-sitter-chi
    - git clone --depth 1 https://github.com/santhoshtr/kurbo-curve-fit-stroke.git ../curve-fit
    - curl -sSL https://github.com/rust-lang/mdBook/releases/download/v0.5.4/mdbook-v0.5.4-x86_64-unknown-linux-gnu.tar.gz | tar -xz -C /usr/local/bin
  script:
    - cargo test --workspace
    - mdbook build docs
  artifacts:
    paths:
      - docs/book

# Publish the book to GitLab Pages from the default branch.
pages:
  stage: deploy
  image: busybox
  script:
    - mv docs/book public
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
