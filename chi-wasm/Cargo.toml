[package]
name = "chi-wasm"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
chi-core = { path = "../chi-core" }
tree-sitter = { workspace = true }
tree-sitter-chi = { path = "../../tree-sitter-chi" }
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
console_error_panic_hook = "0.1"
