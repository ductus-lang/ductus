[workspace]
resolver = "3"
members = [
  "crates/curve-fitter",
  "crates/ductus-core",
  "crates/ductus-cli",
  "crates/ductus-wasm",
  "crates/ductus-docs",
]

[workspace.dependencies]
tree-sitter = "0.26.3"
tree-sitter-ductus = { git = "https://github.com/ductus-lang/tree-sitter-ductus.git" }
clap = { version = "4.0", features = ["derive"] }
kurbo = { version = "0.13.0", features = ["std"] }
