[workspace]
resolver = "3"
members = [
  "crates/curve-fitter",
  "crates/ductus-core",
  "crates/ductus-cli",
  "crates/ductus-wasm",
  "crates/ductus-docs",
  "crates/ductus-lsp",
]

[workspace.dependencies]
tree-sitter = "0.27.2"
tree-sitter-ductus = { git = "https://github.com/ductus-lang/tree-sitter-ductus.git" }
clap = { version = "4.6", features = ["derive"] }
kurbo = { version = "0.13.1", features = ["std"] }
